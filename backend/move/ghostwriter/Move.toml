[package]
name = "ghostwriter"
edition = "2024"

[dependencies]
# Pyth Core Compatible, Testnet (Pyth docs, Sui guide; OPEN-2).
# Wormhole is vendored inside this Pyth package, so there is no separate Wormhole line.
pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-pro-compatible-contract-testnet" }
# Nautilus enclave library, vendored in ../enclave and already published on Testnet
# (see ../enclave/Published.toml), so this dependency resolves to that published address.
enclave = { local = "../enclave" }

# New-style manifest (Sui CLI package manager): Sui, MoveStdlib and the other system packages are
# added implicitly, and the package name `ghostwriter` is its named address, so there is no
# [addresses] section. Nautilus's enclave package is new-style, and old-style manifests cannot
# depend on new-style ones.
